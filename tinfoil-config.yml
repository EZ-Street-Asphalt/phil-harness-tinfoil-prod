# PHIL agent harness (DeepSeek Harness) on Tinfoil Containers — PRODUCTION.
#
# Config only. The image is the generic bootstrap built from
# github.com/EZ-Street-Asphalt/phil-harness-tinfoil (dsh from npm + Caddy +
# bootstrap.sh); PHIL's own plugins, presets and scripts are fetched at boot
# from the private customer-updater repo's `main` branch over a read-only
# deploy key held in Tinfoil's vault. A PHIL release therefore reaches this
# enclave on its next restart (see apps/agent/docs/tinfoil.md, "Production").
#
# To move to a new bootstrap image: pin its digest below, commit, run
# "Tinfoil Release" for vX.Y.Z, then `tinfoil container update phil-dsh-prod --tag vX.Y.Z`.
cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  internet:
    egress: open   # github.com (boot fetch), Tinfoil inference, the PHIL agent app, MCP servers

containers:
  - name: "phil-dsh-prod"
    image: "ghcr.io/ez-street-asphalt/phil-harness-tinfoil@sha256:3bc0bdb910d205e9866a7be1f0a169d7ad0c7d07c4a9e54f54b3f51d83bb0395"
    networks: [internet]
    ports:
      - "8080:8080"
    # dsh keeps state under /data and Caddy autosaves its config; no persistent
    # volume (sessions are ephemeral — connectors, skills, persona,
    # automations, memory and the activity feed live in PHIL).
    read_only: false
    env:
      - PORT: "8080"
      - DSH_PORT: "4120"
      - DSH_HOME: "/data"
      - PHIL_SOURCE_REPO: "git@github.com:EZ-Street-Asphalt/customer-updater.git"
      - PHIL_SOURCE_REF: "main"
      - PHIL_SOURCE_PATH: "apps/agent/dsh"
      - PHIL_GATE: "token"
      - PHIL_TENANT_SLUG: "ez-street"
      - PHIL_TENANT_NAME: "EZ Street"
      - PHIL_AGENT_URL: "https://agent.notacrm.com"
      - TINFOIL_BASE_URL: "https://inference.tinfoil.sh/v1"
      - AGENT_MODEL: "deepseek-v4-1-flash"
      - DSH_TRUSTED_HOST: "phil-dsh-prod.ez-street.containers.tinfoil.dev"
      # The bridge key is a project-scoped secret under its own name (Tinfoil
      # forbids one name in both org and project scope); the entrypoint reads
      # the variable this names into DSH_BRIDGE_KEY.
      - DSH_BRIDGE_KEY_FROM: "DSH_BRIDGE_KEY_PROD"
    secrets:
      - PHIL_SOURCE_SSH_KEY_B64
      - TINFOIL_API_KEY
      - DSH_BRIDGE_KEY_PROD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always

shim:
  upstream-port: 8080
  paths:
    - /*
